<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Security-Policy" content="require-trusted-types-for 'script'">
    <title>Infinite scroll fixture</title>
  </head>
  <body>
    <main id="items"><p>first viewport content</p></main>
    <script>
      let added = 0;
      window.addEventListener("scroll", () => {
        if (added < 5 && window.scrollY + window.innerHeight >= document.body.scrollHeight - 2) {
          const item = document.createElement("p");
          item.textContent = `lazy content ${++added}`;
          document.querySelector("#items").append(item);
          document.body.style.minHeight = `${window.innerHeight * (added + 2)}px`;
        }
      });
      document.body.style.minHeight = "1200px";
    </script>
  </body>
</html>
