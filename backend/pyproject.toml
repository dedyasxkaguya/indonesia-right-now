[build-system]
requires = ["setuptools>=75.8", "wheel>=0.45"]
build-backend = "setuptools.build_meta"

[project]
name = "indonesia-right-now"
version = "0.1.0"
description = "Unified FastAPI service for the newsid and pyscrape CLI tools"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "beautifulsoup4==4.13.3",
    "anyio>=4.6,<5",
    "cachetools>=5.5,<7",
    "click==8.1.8",
    "fastapi>=0.115,<1",
    "feedparser==6.0.14",
    "groq>=0.13,<1",
    "html2text==2024.2.26",
    "httpx==0.28.1",
    "httpcore>=1,<2",
    "pydantic==2.14.1",
    "pydantic-settings>=2.7,<3",
    "python-dotenv>=1,<2",
    "playwright==1.52.0",
    "pyperclip==1.9.0",
    "PyYAML==6.0.3",
    "requests==2.32.3",
    "selectolax==0.4.13",
    "slowapi>=0.1.9,<1",
    "structlog>=24.4,<26",
    "trafilatura==2.0.0",
    "tzdata==2026.5",
    "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = ["ruff>=0.11,<1", "pytest==8.3.5", "respx==0.22.0"]
test = ["pytest==8.3.5", "pytest-asyncio==0.25.3", "respx==0.22.0"]
language = ["langdetect==1.0.9"]

[project.scripts]
indonesia-right-now = "app.main:cli"
newsid = "newsid.cli:main"
pyscrape = "pyscrape.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "newsid*", "pyscrape*"]

[tool.setuptools.data-files]
"share/newsid/presets" = ["presets/indonesia_default.yaml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
